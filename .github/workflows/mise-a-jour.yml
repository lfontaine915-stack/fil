# Robot qui met le fil à jour tout seul, même PC éteint, puis publie le site.
# Heures en UTC : 5h, 8h, 11h, 14h, 17h, 20h à Paris (heure d'hiver).
name: Mise à jour du fil

on:
  schedule:
    - cron: "7 4,7,10,13,16,19 * * *"
  workflow_dispatch: # bouton "Run workflow" pour lancer à la main
  push:
    branches: [main]
    paths:
      - "sources.yaml"
      - "filtres.yaml"
      - "robot/**"
      - "docs/**"
      - ".github/workflows/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mise-a-jour
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collecte des sources
        run: python robot/collecte.py

      - name: Sauvegarde du fil dans le dépôt
        run: |
          git config user.name "robot-fil"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Rien de neuf"
          else
            git commit -m "Mise à jour du fil"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: publication
        uses: actions/deploy-pages@v4
