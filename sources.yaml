# =====================================================================
#  SOURCES DU FIL
#  Tu peux modifier ce fichier directement sur GitHub (icône crayon).
#
#  Chaque source = un bloc qui commence par "- nom:".
#  - themes  : enr, nucleaire, batiment, chantier (un ou plusieurs)
#  - langue  : fr ou en (en = bouton "traduire" affiché)
#  - tri     : tout       -> on garde tout ce que publie la source
#              mots-cles  -> on ne garde que ce qui parle d'un de tes thèmes
#                            (utile pour les sources généralistes)
#  - actif   : mets "non" pour couper une source sans l'effacer
#
#  Pour ajouter une chaîne YouTube : ouvre la chaîne, clic sur
#  "plus d'infos" > "Partager la chaîne" > "Copier l'ID de la chaîne".
#  L'ID commence par UC...
#
#  Attention : garde bien les espaces au début des lignes, comme ci-dessous.
# =====================================================================

